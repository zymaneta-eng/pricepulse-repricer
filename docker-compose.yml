version: '3.8'

services:
  pricepulse-terminal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pricepulse_ai_terminal
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_HEADLESS=true
    volumes:
      - ./catalog.xlsx:/app/catalog.xlsx
      - ./price_history.xlsx:/app/price_history.xlsx
